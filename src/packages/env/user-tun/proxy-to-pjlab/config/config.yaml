mode: global

interface-name: wlp2s0

proxy-groups:
  - name: GLOBAL
    type: select
    proxies:
      - docker-easyconnect
      - naxior

proxies:
  - name: "docker-easyconnect"
    type: socks5
    server: 127.0.0.1
    port: 59553
  - name: "naxior"
    type: socks5
    server: 127.0.0.1
    port: 45200
