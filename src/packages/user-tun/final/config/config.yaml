mode: global

proxy-groups:
  - name: GLOBAL
    type: select
    proxies:
      - home-manager-mihomo-manager-rules
      - rescue
      - direct
      - REJECT

proxies:
  - name: "direct"
    type: socks5
    server: 127.0.0.1
    port: 53077
  - name: "rescue"
    type: socks5
    server: 127.0.0.1
    port: 42279

